name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check-changes:
    name: Check for deployable changes
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: changes
        run: |
          # Deploy only when source code, dependencies, or deploy config change.
          # Skip for docs-only changes (README, CLAUDE.md, *.md, .github/workflows/test.yml, etc.)
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|app/|api/|package\.json|bun\.lock|vercel\.json|next\.config\.js|tsconfig[^/]*\.json|\.vercelignore|\.env\.example)'; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "Deployable files changed — will deploy."
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "No deployable changes — skipping deploy."
          fi

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [check-changes]
    if: needs.check-changes.outputs.should_deploy == 'true'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global vercel@latest
      - name: Deploy to production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
